<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRUD de contatos</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header>
      <div class="conteudo-cabecalho">
        <div class="logo">
          <img src="assets/imagens/logo.png" alt="">
          <h1>Meus Contatos</h1>
        </div>
        <div class="imagem-cabecalho">
          <img 
            src="assets/imagens/computador-cabecalho.png" 
            alt="">
        </div>
      </div>
    </header>
    <main class="background-overlay">
      <div class="overlay"></div>
      <div class="overlay overlay-color"></div>
      <h2>Adicione um contato novo:</h2>
      <section id="form-container">
        <form id="contato-form">
          <input type="hidden" id="contato-id" />
          <label for="contato-conteudo">Contato</label>
          <textarea id="contato-conteudo" placeholder="Digite seu contato" required></textarea>
          <label for="contato-numero">Número</label>
          <input 
            type="text" 
            id="contato-numero" 
            placeholder="Insira um numero" 
            required />
          <div class="form-botoes">
            <button 
              type="submit" 
              id="botao-salvar">
              Salvar
            </button>
            <button 
              type="button" 
              id="botao-cancelar">
              Cancelar
            </button>
          </div>
        </form>
      </section>
      <span></span>
      <section id="lista-contatos-container">
        <h3>Meus contatos</h3>
        <div id="mensagem-vazia" class="mensagem-vazia">
          <img src="assets/imagens/lista-vazia.png" alt="Nenhum contato disponível">
          <p>Nada por aqui ainda, que tal compartilhar alguma ideia?</p>
        </div>
        <ul id="lista-contatos"></ul>
      </section>
    </main>
    <footer>
      <p>&copy; 
        2026 Desenvolvido por Ester Arielle. 
        2°AMS.</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
    <script type="module" src="js/api.js"></script>
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/ui.js"></script>
  </body>
</html>
